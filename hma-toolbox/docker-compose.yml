services:
  toolbox:
    build: .
    container_name: hma-toolbox
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # PostgreSQL
      - PG_HOST=h2dnymbgnulve0kko87nh856
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=${PG_PASSWORD}
      - PG_DATABASE=postgres
      # Pennylane tokens
      - PENNYLANE_TOKEN_HMA=${PENNYLANE_TOKEN_HMA}
      - PENNYLANE_TOKEN_STIVMAT=${PENNYLANE_TOKEN_STIVMAT}
      - PENNYLANE_TOKEN_STA=${PENNYLANE_TOKEN_STA}
      - PENNYLANE_TOKEN_ETPA=${PENNYLANE_TOKEN_ETPA}
      # Odoo
      - ODOO_URL=${ODOO_URL:-https://odoo.hma.business}
      - ODOO_DB=${ODOO_DB:-HMA}
      - ODOO_USER=${ODOO_USER:-hmagestion@gmail.com}
      - ODOO_PASSWORD=${ODOO_PASSWORD}
      # Qdrant
      - QDRANT_URL=${QDRANT_URL:-https://qdrant.hma.business:443}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - coolify

networks:
  coolify:
    external: true
